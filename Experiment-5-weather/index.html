<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container mt-5">
        <div class="card p-4 mx-auto" style="max-width: 450px;">

            <h2 class="text-center mb-4">Weather App</h2>

            <input type="text" id="city" class="form-control mb-3"
                   placeholder="Enter city name">

            <button class="btn btn-primary w-100" onclick="getWeather()">
                Get Weather
            </button>

            <div id="result" class="text-center mt-4">
                <p>Enter a city to check weather.</p>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
