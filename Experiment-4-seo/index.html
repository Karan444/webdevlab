<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First SEO Website</title>

    <meta name="description" content="A simple website created to learn SEO and web accessibility.">

    <link rel="stylesheet" href="style.css">
</head><link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Learning SEO and Web Accessibility</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main>

        <section id="home">
            <h2>Home</h2>
            <p>This is a simple webpage made using HTML and CSS.</p>
        </section>

        <section id="about">
            <h2>About SEO</h2>
            <p>SEO helps websites appear in search engine results.</p>

            <img src="https://placehold.co/300x150"
                 alt="A sample image used for learning web accessibility">
        </section>

        <section id="contact">
            <h2>Contact Us</h2>

            <form>
                <label for="name">Enter your name:</label>
                <input type="text" id="name" name="name">

                <button type="submit">Submit</button>
            </form>
        </section>

    </main>

    <footer>
        <p>Created for Web Designing Lab</p>
    </footer>

</body>
</html>
