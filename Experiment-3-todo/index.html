<!DOCTYPE html>
<html>
<head>
    <title>To Do List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

    <div class="container mt-5">
        <h2 class="text-center">My To Do List</h2>

        <div class="row mt-4">
            <div class="col-md-8">
                <input type="text" id="taskInput" class="form-control"
                placeholder="Enter your task">
            </div>

            <div class="col-md-4">
                <button class="btn btn-primary w-100" onclick="addTask()">
                    Add Task
                </button>
            </div>
        </div>

        <ul id="taskList" class="list-group mt-4">
        </ul>
    </div>

    <script src="script.js"></script>

</body>
</html>
